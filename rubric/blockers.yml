    why: Director and above only. The positive title filter in portals.yml lets IC titles through on words like Production and AI; this gate closes that. Forwards from the owner bypass it.
    require_any_in: [title]
    patterns:
      - VP
      - Vice President
      - SVP
      - EVP
      - Head of
      - Head,
      - Director
      - Managing Director
      - Chief
      - President
      - Executive Producer
      - Principal
      - Managing Partner
      - Executive Producer
      - Post Production Lead
      - Post-Production Lead
      - Lead Post Production
      - Lead, Post Production
      - Head,
      # secondary archetype titles (Enterprise AE, solutions)
      - Account Executive
      - Account Director
      - Strategic Account
      - Enterprise Account
      - Solutions Architect
      - Solutions Consultant
      - Creative Workflow Architect

