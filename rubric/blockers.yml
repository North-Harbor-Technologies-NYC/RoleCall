# Hard filters. Applied to every inbound role BEFORE any scoring or LLM evaluation.
# A role that trips any `hard` rule is logged to the tracker as SKIP with the rule id
# and gets no further tokens. `soft` rules do not block; they are passed to the
# evaluator as flags and cost points in the rubric.
#
# Source: profile/positioning.md (Location Scoring Rules, What to Penalize) and the
# title_filter in portals/portals.yml. Keep the two in sync.

hard:
