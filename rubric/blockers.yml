  - id: onsite_west_coast
    why: SF or LA with 4+ days on site and no flexibility is a hard blocker. Hybrid or flexible SF/LA is soft, see below.
    match_all_in: [location, description]
    patterns_all:
      - ["San Francisco", "Los Angeles", "Bay Area", "Burbank", "Culver City", "Santa Monica", "Universal City", "Glendale", "Seattle", "Austin", "Denver", "Los Gatos", "Redwood City"]
      - ["on-site 4", "onsite 4", "four days", "4 days", "5 days", "five days", "fully on-site", "fully onsite", "in-office 5", "in office 5", "must relocate", "relocation required"]

  - id: onsite_outside_home_metro
    why: Any office outside the home metro with 4 or more days on site is a hard blocker. Put your own metro terms in location_none_of. Needs the JD, so the evaluator applies it after the JD fetch; the feed scan cannot.
    match_all_in: [location, description]
    patterns_all:
      - ["on-site 4", "onsite 4", "four days", "4 days", "5 days", "five days", "fully on-site", "fully onsite", "in-office 4", "in office 4", "in-office 5", "in office 5", "must relocate", "relocation required", "relocation needed"]
    location_none_of: ["New York", "NY", "NYC", "Manhattan", "Brooklyn", "Queens", "Jersey City", "Hoboken", "Stamford", "Remote", "Hybrid"]

