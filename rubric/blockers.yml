soft:
  - id: comp_below_floor
    why: Stated base below the floor in profile/profile.yml. Flag, do not block, because many postings understate.
    rule: if a base salary or range is stated and its top is below profile.compensation.minimum, flag.

  - id: west_coast_flexible
    why: SF or LA with hybrid or flexible attendance scores 2.5/5 on location, per positioning.md.
    match_any_in: [location]
    patterns: ["San Francisco", "Los Angeles", "Bay Area", "Burbank", "Culver City", "Santa Monica"]

  - id: customer_success
    why: CS is not a primary archetype. Evaluate only if Director+ and enterprise.
    match_any_in: [title]
    patterns: ["Customer Success"]

  - id: creative_director
    why: Usually brand or campaign creative, a different track. Evaluate only if production or content operations is in scope.
    match_any_in: [title]
    patterns: ["Creative Director"]

  - id: mba_required
    why: MBA as a hard requirement, not preferred.
    match_any_in: [description]
    patterns: ["MBA required", "MBA is required", "must have an MBA"]

  - id: ai_afterthought
    why: Roles where AI is a roadmap item rather than the work.
    rule: evaluator judgment from the JD text.

  - id: aggregator_source
    why: Roles sourced from LinkedIn Jobs, Indeed, Glassdoor, or Built In may be stale. Verify the original posting before scoring.
    rule: flag when the source is an aggregator email rather than a company or ATS alert.

# Title must also pass the positive filter in portals/portals.yml (at least one leadership,
# AI, post-production, media operations, enterprise sales, or advisory keyword) unless it
# arrived by direct forward from the owner, which bypasses the title filter.
