# RoleCall portal configuration (example: media, entertainment, sports, and AI companies)
# Tailored for: Media & Entertainment | Creative AI Tools | Studios & Streamers | AI Agencies
# Last updated: April 2026

# -- Title filter --
# At least 1 positive keyword must match AND 0 negatives must match (case-insensitive).

title_filter:
  # Positives are domain words only (changed 2026-10-13). The leadership level is enforced by the
  # seniority_required gate in rubric/blockers.yml, so VP, Director, and Head of are not listed here;
  # a title must carry a domain word AND pass that gate. Matching is whole-word, case-insensitive
  # (portals/_filters.mjs), so "AI" no longer matches "training" and "Production" no longer matches "reproduction".
  positive:
    # -- Post-production, content, media, production --
    - "Post-Production"
    - "Post Production"
    - "Head of Post"
    - "Content"
    - "Media"
    - "Production"
    - "Video"
    - "Multimedia"
    - "Creative"
    - "Studio"
    - "Broadcast"
    - "Programming"
    - "Localization"
    - "Dubbing"
    - "Editorial"
    - "Entertainment"
    - "Streaming"
    - "Film"
    - "Television"
    - "Podcast"
    - "Executive Producer"
    # -- AI --
    - "AI"
    - "Generative"
    - "GenAI"
    - "Transformation"
    # -- Operations and technology --
    - "Operations"
    - "Workflow"
    - "Supply Chain"
    - "Technology"
    # -- Sales and partnerships (Enterprise AE track) --
    - "Enterprise"
    - "Strategic Account"
    - "Strategic Accounts"
    - "Account Executive"
    - "Account Director"
    - "Partnerships"
    # -- Consulting and advisory --
    - "Solutions"
    - "Advisory"
  negative:
    # -- Seniority / role level --
    - "Junior"
    - "Associate"
    - "Intern"
    - "Coordinator"
    - "Assistant Editor"
    - "Staff Editor"
    # -- Engineering / technical roles not relevant --
    - "Data Scientist"
    - "Software Engineer"
    - "Backend Engineer"
    - "Frontend Engineer"
    - "DevOps"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Embedded"
    - "COBOL"
    # -- Too-broad title matches (caused noise last scan) --
    - "Creative Director"        # matched brand copywriting, gaming - too junior/different track
    - "Product Marketing"        # not target function
    - "Product Manager"          # product management is not a target function (added 2026-10-13)
    - "Product Management"
    - "Brand Marketing"
    - "Growth Marketing"
    - "Performance Marketing"
    - "CMS"                      # content management system roles, not media ops
    - "Healthcare"
    - "Clinical"
    - "Legal"
    - "Compliance"
    - "Finance Director"
    - "Controller"
    # -- Engineering / research roles (new API providers pull full job boards) --
    - "Research Engineer"
    - "Staff Engineer"
    - "Software Engineer"
    - "Solutions Engineer"      # technical pre-sales engineer, not advisory
    - "Infrastructure Engineer"
    - "Inference Engineer"
    - "Member of Technical Staff"
    - "ML Engineer"
    - "Machine Learning"
    - "Data Engineer"
    - "Platform Engineer"
    - "Security Engineer"
    - "QA Engineer"
    - "Site Reliability"
    - "Researcher"              # AI Researcher, Staff Researcher etc.
    - "Deployment Strategist"   # technical deployment role
    - "Commercial Counsel"      # legal
    - "Executive Assistant"
    - "Customer Support Specialist"
    # -- Regional / language variants (API providers pull all global listings) --
    - "German Speaking"
    - "French Speaking"
    - "Italian Speaking"
    - "Spanish Speaking"
    - "DACH"
    - "India"
    - "LATAM"
    - "Latin America"
    - "Middle East"
    - "Southeast Asia"
    - "North Asia"
    - "ANZ"
    - "Oceania"
    - "Brazil"
    - "Mexico"
    - "Spain"
    - "France"
    - "Germany"
    - "UK/I"
    - "Australia"
    - "Government"              # public sector AE roles
    - "Customer Success Manager" # CS not primary archetype
    - "Procurement"             # supply chain/purchasing
    - "Product Designer"        # design role, not ops/sales/strategy
    - "GTM Enablement"          # internal sales ops
    - "SMB"                     # wrong deal level
    - "Mid-Market"              # wrong deal level (enterprise and strategic deal levels only)
    - "Production Manager"      # IC level, below seniority target
    - "Deputy Managing Editor"  # editorial IC
    # -- Geographic noise (European offices of US companies) --
    - "EMEA"
    - "APAC"
    - "Munich"
    - "Paris"
    - "Berlin"
    - "Amsterdam"
    - "Zurich"
    - "Zürich"
    - "London"
    - "Singapore"
    - "Tokyo"
    - "Sydney"
    - "Netherlands"
    - "Chile"
    - "Benelux"
    - "United Kingdom"
    - "Europe"                  # catch "- Europe" regional suffixes
  seniority_boost:
    - "VP"
    - "EVP"
    - "SVP"
    - "Head of"
    - "Senior Director"
    - "Director"
    - "Principal"

# -- Search queries --
# Broad discovery across job portals for the owner's target roles.

search_queries:
  # -- Creative AI / Generative Video companies --
  - name: Ashby - AI Content & Production Leadership
    query: 'site:jobs.ashbyhq.com "Head of" OR "VP" OR "Director" "AI" OR "Content" OR "Production" OR "Creative"'
    enabled: true

  - name: Greenhouse - AI Content & Production Leadership
    query: 'site:job-boards.greenhouse.io "Head of" OR "VP" OR "Director" "AI" OR "content" OR "production" OR "post-production"'
    enabled: true

  - name: Lever - AI Content Leadership
    query: 'site:jobs.lever.co "VP" OR "Head of" "AI" OR "content" OR "production" OR "media"'
    enabled: true

  # -- Enterprise AE at AI tools companies --
  - name: Ashby - Enterprise AE Media & Entertainment
    query: 'site:jobs.ashbyhq.com "Enterprise Account Executive" OR "Account Director" "media" OR "entertainment" OR "AI"'
    enabled: true

  - name: Greenhouse - Enterprise AE AI tools
    query: 'site:job-boards.greenhouse.io "Enterprise Account Executive" "AI" OR "creative" OR "media"'
    enabled: true

  # -- Post-Production & Media Operations at tech-forward companies --
  - name: All portals - Post-Production Leadership
    query: '"Head of Post-Production" OR "VP Post Production" OR "Director of Post Production" AI OR streaming OR "generative"'
    enabled: true

  # -- AI Transformation & Strategy --
  - name: All portals - AI Transformation Leadership
    query: '"AI Transformation" OR "AI Strategy" OR "Head of AI" OR "VP of AI" "media" OR "content" OR "entertainment" OR "creative"'
    enabled: true

  # -- Wellfound startups --
  - name: Wellfound - Creative AI Leadership
    query: 'site:wellfound.com "Head of" OR "VP" "AI" OR "content" OR "post-production" OR "generative"'
    enabled: true


